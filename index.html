    // ============================================================================
    // 4. ANIMATED BOHR ATOM MODEL COMPONENT
    // ============================================================================
    const AtomModel = ({ element }) => {
      const [playing, setPlaying] = useState(true);
      const [speed, setSpeed] = useState(1);
      const canvasRef = useRef(null);
      const angleRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const render = () => {
          const dpr = window.devicePixelRatio || 1;
          const size = 250;
          if (canvas.width !== size * dpr) {
            canvas.width = size * dpr;
            canvas.height = size * dpr;
          }
          ctx.save();
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, size, size);

          const cx = size / 2;
          const cy = size / 2;
          const shells = element.shells || [1];
          const numShells = shells.length;
          const maxRadius = 108;
          const minRadius = 26;
          const step = numShells > 1 ? (maxRadius - minRadius) / (numShells - 1) : 0;

          shells.forEach((count, sIdx) => {
            const radius = numShells === 1 ? 56 : minRadius + sIdx * step;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(230, 57, 38, 0.28)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            const dir = sIdx % 2 === 0 ? 1 : -1;
            const shellSpeed = (0.016 / (1 + sIdx * 0.28)) * dir;
            for (let e = 0; e < count; e++) {
              const theta = (e / count) * Math.PI * 2 + angleRef.current * shellSpeed * 60;
              const ex = cx + Math.cos(theta) * radius;
              const ey = cy + Math.sin(theta) * radius;

              ctx.beginPath();
              ctx.arc(ex, ey, 3.2, 0, Math.PI * 2);
              ctx.fillStyle = '#e63926';
              ctx.fill();

              ctx.beginPath();
              ctx.arc(ex, ey, 1.3, 0, Math.PI * 2);
              ctx.fillStyle = '#FFFFFF';
              ctx.fill();
            }
          });

          const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 18);
          grad.addColorStop(0, '#e63926');
          grad.addColorStop(1, '#7F1D1D');
          ctx.beginPath();
          ctx.arc(cx, cy, 15, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '700 10px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(element.symbol, cx, cy);

          ctx.restore();

          if (playing) {
            angleRef.current += 0.015 * speed;
          }
          animId = requestAnimationFrame(render);
        };

        animId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animId);
      }, [element, playing, speed]);

      const shellNames = ['K', 'L', 'M', 'N', 'O', 'P', 'Q'];

      return (
        <div className="bg-[#0d0e12] border border-[#232736] rounded-xl p-4 flex flex-col items-center">
          <div className="w-full flex items-center justify-between mb-2">
            <span className="text-[11px] font-bold uppercase tracking-wider text-[#94a3b8] flex items-center gap-1.5">
              <Icon name="atom" className="w-3.5 h-3.5 text-[#e63926]" />
              Bohr Shell Model
            </span>
            <div className="flex items-center gap-1">
              <button
                onClick={() => setPlaying(!playing)}
                className="p-1.5 rounded-lg bg-[#131620] border border-[#232736] text-[#f1f5f9] hover:border-[#e63926] hover:text-[#e63926] transition-colors"
                title={playing ? "Pause Orbit" : "Resume Orbit"}
              >
                <Icon name={playing ? "pause" : "play"} className="w-3.5 h-3.5" />
              </button>
              <button
                onClick={() => setSpeed(s => (s === 1 ? 2.5 : 1))}
                className="px-2 py-1 rounded-lg bg-[#131620] border border-[#232736] text-[11px] font-mono font-semibold text-[#f1f5f9] hover:border-[#e63926] hover:text-[#e63926] transition-colors"
              >
                {speed}x
              </button>
            </div>
          </div>

          <canvas ref={canvasRef} style={{ width: 250, height: 250 }} className="my-1" />

          <div className="w-full mt-2 pt-2 border-t border-[#232736] flex flex-wrap justify-center gap-1.5">
            {element.shells.map((count, idx) => (
              <span
                key={idx}
                className="px-2 py-0.5 rounded bg-[#131620] border border-[#232736] text-[11px] font-mono text-[#f1f5f9]"
              >
                <strong className="text-[#e63926]">{shellNames[idx]}</strong>:{count}
              </span>
            ))}
          </div>
        </div>
      );
    };

              stroke="#262b3d"
              strokeWidth="1.5"

    // ============================================================================

    const TableViewport = ({ layoutId, elements, onSelect, searchQuery, blockFilter, categoryFilter }) => {
      const isMatch = (el) => {
        const q = searchQuery.trim().toLowerCase();
        const matchSearch =
          !q ||
          el.name.toLowerCase().includes(q) ||
          el.symbol.toLowerCase().includes(q) ||
          String(el.z) === q ||
          el.category.toLowerCase().includes(q);
        const matchBlock = blockFilter === 'ALL' || el.block.toUpperCase() === blockFilter;
        const matchCategory = categoryFilter === 'ALL' || el.category === categoryFilter;
        return matchSearch && matchBlock && matchCategory;
      };

      if (layoutId === 'iupac' || layoutId === 'seaborg' || layoutId === 'moseley') {
        const mainElements = elements.filter(
          el => !(el.z >= 57 && el.z <= 71) && !(el.z >= 89 && el.z <= 103)
        );
        const lanthanides = elements.filter(el => el.z >= 57 && el.z <= 71);
        const actinides = elements.filter(el => el.z >= 89 && el.z <= 103);

        const gridMatrix = Array.from({ length: 7 }, () => Array(18).fill(null));
        mainElements.forEach(el => {
          if (el.period >= 1 && el.period <= 7 && el.group >= 1 && el.group <= 18) {
            gridMatrix[el.period - 1][el.group - 1] = el;
          }
        });

        return (
          <div className="overflow-x-auto pb-2">
            <div className="min-w-[1040px] space-y-3">

                      if (rIdx === 6 && cIdx === 2) {

                          <div key="ac-marker" className="rounded-lg border border-dashed border-orange-500/60 bg-orange-500/10 p-1.5 flex flex-col items-center justify-center text-center">

      if (layoutId === 'mendeleev') {

              { gap: "Eka-Boron (? = 44)", actualZ: 21, note: "Predicted by Mendeleev in 1871; discovered as Scandium in 1879." },

            series: "Series 5",

                <div key={idx} className="grid grid-cols-9 gap-2 items-stretch">
                  <div className="bg-[#0d0e12] border border-[#232736] rounded-lg px-2 flex items-center justify-center font-mono text-xs font-bold text-[#94a3b8]">

                  {row.cells.map((item, cIdx) => {
                    if (!item) return <div key={cIdx} className="rounded-lg bg-[#0d0e12]/50 border border-[#1d202e]" />;
                    if (typeof item === 'object' && item.gap) {
                      const actualEl = ELEMENT_MAP[item.actualZ];
                      return (
                        <button

                          onClick={() => onSelect(actualEl)}
                          className="rounded-lg border-2 border-dashed border-[#e63926] bg-[#e63926]/10 p-2 text-left hover:bg-[#e63926] text-[#f1f5f9] hover:text-white group transition-colors"

          { nl: "n + l = 7 (f+d+p+s)", els: [57,58,59,60,61,62,63,64,65,66,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88] },

            <div className="min-w-[1100px] space-y-1.5">

                <div key={idx} className="flex items-center justify-end gap-1">

      if (layoutId === 'lavoisier') {

          { title: "III. Metallic Substances", ids: [51, 47, 33, 83, 27, 29, 50, 26, 25, 80, 42, 28, 79, 78, 82, 74, 30], extra: [] },
          { title: "IV. Salifiable Earthy Substances", ids: [20, 12, 56, 13, 14], extra: ["Lime (CaO)", "Magnesia (MgO)", "Barytes (BaO)", "Argill (Al₂O₃)", "Silex (SiO₂)"] }
        ];

        return (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {groups.map((grp, idx) => (
              <div key={idx} className="bg-[#0d0e12] border border-[#232736] rounded-xl p-4">

                <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">

                    const el = ELEMENT_MAP[z];
